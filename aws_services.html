<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serviços AWS — Guia Completo</title>
<style>
:root{
  --bg:#0f1117;--bg2:#1a1d27;--bg3:#22263a;--border:#2e3250;
  --accent:#f97316;--accent2:#fb923c;
  --green:#34d399;--yellow:#fbbf24;--red:#f87171;--blue:#60a5fa;--purple:#a78bfa;
  --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;--r:8px;
  --clf:#f59e0b;--saa:#3b82f6;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;
     font-size:15px;line-height:1.6;display:flex;min-height:100vh;overflow-x:hidden;}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:98;}
#overlay.open{display:block;}
#sidebar{width:220px;min-width:220px;background:var(--bg2);border-right:1px solid var(--border);
          display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
.sb-logo{padding:16px 16px 10px;border-bottom:1px solid var(--border);}
.sb-logo h1{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.5px;}
.sb-logo p{font-size:11px;color:var(--text3);margin-top:2px;}
.sb-section{padding:10px 0 4px 14px;font-size:10px;font-weight:700;color:var(--text3);
             letter-spacing:1px;text-transform:uppercase;}
.ni{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;
     border-left:3px solid transparent;transition:all .2s;text-decoration:none;
     color:var(--text2);font-size:12.5px;background:none;border-right:none;
     border-top:none;border-bottom:none;width:100%;text-align:left;}
.ni:hover{background:var(--bg3);color:var(--text);border-left-color:var(--accent2);}
.ni.active{background:rgba(249,115,22,.1);color:var(--accent2);border-left-color:var(--accent);}
.ni .ic{font-size:13px;width:18px;text-align:center;flex-shrink:0;}
#main{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
#topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 18px;
         display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;flex-wrap:wrap;}
#topbar h2{font-size:14px;font-weight:700;color:var(--text);flex-shrink:0;}
.search-wrap{flex:1;min-width:160px;}
#searchbox{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:6px;
            padding:6px 10px;color:var(--text);font-size:13px;outline:none;}
#searchbox:focus{border-color:var(--accent);}
.cert-filter{display:flex;gap:6px;flex-shrink:0;}
.cf-btn{padding:5px 10px;border-radius:20px;border:1px solid var(--border);background:transparent;
          cursor:pointer;font-size:12px;color:var(--text2);transition:all .2s;}
.cf-btn.active{background:var(--bg3);color:var(--text);border-color:var(--accent2);}
.cf-btn.clf{color:var(--clf);border-color:rgba(245,158,11,.3);}
.cf-btn.clf.active{background:rgba(245,158,11,.15);border-color:var(--clf);}
.cf-btn.saa{color:var(--saa);border-color:rgba(59,130,246,.3);}
.cf-btn.saa.active{background:rgba(59,130,246,.15);border-color:var(--saa);}
#count{font-size:11px;color:var(--text3);white-space:nowrap;}
#content{padding:16px 20px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;}
.svc-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);
            overflow:hidden;transition:border-color .2s;}
.svc-card:hover{border-color:rgba(249,115,22,.35);}
.svc-head{display:flex;align-items:flex-start;gap:10px;padding:12px 14px 8px;
            border-bottom:1px solid var(--border);}
.svc-icon{font-size:24px;flex-shrink:0;}
.svc-info h3{font-size:13.5px;font-weight:700;color:var(--text);line-height:1.3;}
.svc-info .abbr{font-size:10px;color:var(--text3);font-family:monospace;}
.svc-badges{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;}
.badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;letter-spacing:.3px;}
.badge.cat{background:rgba(249,115,22,.12);color:var(--accent);border:1px solid rgba(249,115,22,.25);}
.badge.clf{background:rgba(245,158,11,.12);color:var(--clf);border:1px solid rgba(245,158,11,.3);}
.badge.saa{background:rgba(59,130,246,.12);color:var(--saa);border:1px solid rgba(59,130,246,.3);}
.svc-desc{padding:10px 14px 0;font-size:12.5px;color:var(--text2);}
.svc-ex{display:none;margin:8px 14px 12px;background:var(--bg3);border-left:3px solid var(--accent);
          border-radius:0 4px 4px 0;padding:8px 10px;font-size:12px;color:var(--text2);}
.ex-toggle{display:flex;align-items:center;gap:5px;margin:8px 14px 10px;cursor:pointer;
             font-size:11.5px;color:var(--text3);user-select:none;width:fit-content;}
.ex-toggle:hover{color:var(--accent2);}
.ex-toggle .arr{transition:transform .2s;}
.ex-toggle.open .arr{transform:rotate(90deg);}
.hero{background:linear-gradient(135deg,rgba(249,115,22,.12),rgba(251,146,60,.05));
        border:1px solid rgba(249,115,22,.2);border-radius:var(--r);padding:16px 20px;
        margin-bottom:16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.hero h1{font-size:18px;font-weight:800;color:var(--text);}
.hero p{font-size:13px;color:var(--text2);}
.stat-row{display:flex;gap:16px;flex-wrap:wrap;}
.stat-itm{text-align:center;}
.stat-itm .n{font-size:22px;font-weight:800;color:var(--accent2);}
.stat-itm .l{font-size:10px;color:var(--text3);}
.empty{text-align:center;padding:60px 20px;color:var(--text3);font-size:14px;}
/* Hamburger */
#hamburger{display:none;background:none;border:none;cursor:pointer;padding:6px 8px;
            border-radius:6px;color:var(--text);font-size:20px;line-height:1;flex-shrink:0;}
#hamburger:hover{background:var(--bg3);}
@media(max-width:768px){
  body{display:block;}
  #sidebar{position:fixed!important;left:-240px;top:0;height:100%!important;
            width:230px!important;min-width:0!important;z-index:99;
            transition:left .28s ease;box-shadow:6px 0 24px rgba(0,0,0,.5);overflow-y:auto;}
  #sidebar.open{left:0!important;}
  #hamburger{display:inline-flex!important;align-items:center;justify-content:center;}
  #main{width:100%;}
  #topbar{padding:8px 10px;gap:6px;}
  #topbar h2{font-size:13px;}
  .search-wrap{min-width:120px;}
  #content{padding:10px 8px;}
  .grid{grid-template-columns:1fr;gap:10px;}
  .cert-filter{gap:4px;}
  .cf-btn{padding:4px 8px;font-size:11px;}
}
</style>
</head>
<body>
<div id="overlay"></div>
<nav id="sidebar">
  <div class="sb-logo">
    <h1>☁️ AWS Services</h1>
    <p>Guia completo de serviços</p>
  </div>
  <div class="sb-section">Categorias</div>
  <button class="ni active" onclick="filterCat(null,this)" id="nb-all">
    <span class="ic">☁️</span>Todos os serviços</button>
  <button class="ni" onclick="filterCat('Analytics',this)" id="nb-Analytics"><span class="ic">📊</span>Analytics</button>
  <button class="ni" onclick="filterCat('Armazenamento',this)" id="nb-Armazenamento"><span class="ic">💾</span>Armazenamento</button>
  <button class="ni" onclick="filterCat('Banco de Dados',this)" id="nb-Banco_de_Dados"><span class="ic">🗃️</span>Banco de Dados</button>
  <button class="ni" onclick="filterCat('Computação',this)" id="nb-Computação"><span class="ic">🖥️</span>Computação</button>
  <button class="ni" onclick="filterCat('Comunicação',this)" id="nb-Comunicação"><span class="ic">📨</span>Comunicação</button>
  <button class="ni" onclick="filterCat('Custo',this)" id="nb-Custo"><span class="ic">💰</span>Custo</button>
  <button class="ni" onclick="filterCat('DevOps',this)" id="nb-DevOps"><span class="ic">⚙️</span>DevOps</button>
  <button class="ni" onclick="filterCat('Integração',this)" id="nb-Integração"><span class="ic">🔌</span>Integração</button>
  <button class="ni" onclick="filterCat('ML & IA',this)" id="nb-ML__IA"><span class="ic">🤖</span>ML & IA</button>
  <button class="ni" onclick="filterCat('Migração',this)" id="nb-Migração"><span class="ic">🚀</span>Migração</button>
  <button class="ni" onclick="filterCat('Monitoramento',this)" id="nb-Monitoramento"><span class="ic">📡</span>Monitoramento</button>
  <button class="ni" onclick="filterCat('Rede',this)" id="nb-Rede"><span class="ic">🌐</span>Rede</button>
  <button class="ni" onclick="filterCat('Segurança',this)" id="nb-Segurança"><span class="ic">🔑</span>Segurança</button>
  <div style="margin-top:auto;padding:14px;border-top:1px solid var(--border);">
    <a href="index.html" style="font-size:12px;color:var(--text3);text-decoration:none;">← Voltar ao Hub</a>
  </div>
</nav>

<div id="main">
  <div id="topbar">
    <button id="hamburger" onclick="toggleSidebar()" aria-label="Menu">☰</button>
    <h2>☁️ AWS Services</h2>
    <div class="search-wrap">
      <input type="text" id="searchbox" placeholder="Buscar serviço..." oninput="doFilter()">
    </div>
    <div class="cert-filter">
      <button class="cf-btn active" onclick="filterCert(null,this)">Todos</button>
      <button class="cf-btn clf" onclick="filterCert('CLF',this)">CLF-C02</button>
      <button class="cf-btn saa" onclick="filterCert('SAA',this)">SAA-C03</button>
    </div>
    <span id="count"></span>
  </div>
  <div id="content">
    <div class="hero">
      <div>
        <h1>Serviços AWS</h1>
        <p>Referência completa de serviços, com descrição, exemplo de uso e quais certificações cobram cada serviço.</p>
      </div>
      <div class="stat-row">
        <div class="stat-itm"><div class="n">120</div><div class="l">Serviços</div></div>
        <div class="stat-itm"><div class="n">13</div><div class="l">Categorias</div></div>
        <div class="stat-itm"><div class="n">2</div><div class="l">Certificações</div></div>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">Nenhum serviço encontrado para este filtro.</div>
  </div>
</div>

<script>
const SVCS = [{"name": "Amazon EC2", "abbr": "EC2", "cat": "Computação", "icon": "🖥️", "certs": ["CLF", "SAA"], "desc": "Servidores virtuais (instâncias) na nuvem com CPU, memória e SO configuráveis. Suporta dezenas de tipos otimizados para diferentes cargas de trabalho.", "ex": "Hospedar uma aplicação web Node.js em instâncias t3.medium em múltiplas AZs atrás de um ALB, com Auto Scaling para absorver picos de tráfego."}, {"name": "EC2 Auto Scaling", "abbr": "ASG", "cat": "Computação", "icon": "📈", "certs": ["CLF", "SAA"], "desc": "Aumenta ou reduz automaticamente o número de instâncias EC2 com base em demanda, agendamento ou métricas do CloudWatch.", "ex": "Escalar de 2 para 20 instâncias durante Black Friday e voltar a 2 às 2h da manhã com política de scaling agendada."}, {"name": "AWS Lambda", "abbr": "Lambda", "cat": "Computação", "icon": "⚡", "certs": ["CLF", "SAA"], "desc": "Executa código sem provisionar servidores. Você paga apenas pelo tempo de execução (por milissegundo). Limite de 15 minutos por execução.", "ex": "Processar cada imagem enviada ao S3 em menos de 1 segundo — Lambda é acionado pelo evento S3 PutObject e faz o redimensionamento."}, {"name": "AWS Elastic Beanstalk", "abbr": "EB", "cat": "Computação", "icon": "🌱", "certs": ["CLF", "SAA"], "desc": "PaaS que abstrai EC2, ALB, ASG e RDS. Você envia o código, a AWS cuida da infraestrutura. Suporta Java, Python, Node, PHP, Ruby, .NET, Go.", "ex": "Fazer deploy de uma API Flask sem configurar EC2 ou load balancer — só `eb deploy` e a aplicação está no ar."}, {"name": "Amazon ECS", "abbr": "ECS", "cat": "Computação", "icon": "🐳", "certs": ["CLF", "SAA"], "desc": "Orquestrador de containers Docker gerenciado pela AWS. Roda tasks/services em instâncias EC2 (launch type EC2) ou sem servidor (Fargate).", "ex": "Rodar 10 réplicas de um microserviço em containers, com ECS atualizando automaticamente as tasks ao fazer deploy de nova imagem."}, {"name": "Amazon EKS", "abbr": "EKS", "cat": "Computação", "icon": "☸️", "certs": ["CLF", "SAA"], "desc": "Kubernetes gerenciado pela AWS. O control plane é mantido pela AWS; você gerencia os worker nodes ou usa Fargate para nodes serverless.", "ex": "Migrar um cluster Kubernetes on-premises para EKS sem reescrever os manifests YAML — compatibilidade total com K8s padrão."}, {"name": "AWS Fargate", "abbr": "Fargate", "cat": "Computação", "icon": "🚀", "certs": ["CLF", "SAA"], "desc": "Motor serverless para ECS e EKS. Elimina a necessidade de gerenciar instâncias EC2 para containers — você define CPU/memória e a AWS provisiona.", "ex": "Rodar jobs de processamento batch em containers sem manter uma frota de EC2 — paga só pelo tempo que o container executa."}, {"name": "AWS Batch", "abbr": "Batch", "cat": "Computação", "icon": "📦", "certs": ["SAA"], "desc": "Executa jobs de computação em lote em qualquer escala, provisionando automaticamente a capacidade EC2 ou Fargate necessária.", "ex": "Processar 1 milhão de arquivos de simulação financeira overnight, com Batch gerenciando a fila e o provisionamento de instâncias spot."}, {"name": "Amazon Lightsail", "abbr": "Lightsail", "cat": "Computação", "icon": "💡", "certs": ["CLF"], "desc": "VPS simplificado com preço fixo mensal. Inclui VM, SSD, transferência de dados, IP estático e DNS. Ideal para projetos simples.", "ex": "Hospedar um blog WordPress por $5/mês sem precisar configurar VPC, subnet ou security groups."}, {"name": "AWS Outposts", "abbr": "Outposts", "cat": "Computação", "icon": "🏭", "certs": ["CLF", "SAA"], "desc": "Hardware AWS instalado fisicamente no seu datacenter. Permite rodar serviços AWS on-premises com a mesma API e console.", "ex": "Empresa com requisito de dados não saírem do país usa Outposts para rodar EC2 e RDS no próprio datacenter com APIs AWS."}, {"name": "AWS App Runner", "abbr": "App Runner", "cat": "Computação", "icon": "🏃", "certs": ["SAA"], "desc": "Deploy de aplicações web e APIs diretamente de código-fonte ou imagem de container, sem configurar infraestrutura. Auto-scaling incluso.", "ex": "Fazer deploy de uma API REST em Go a partir do ECR com App Runner — zero configuração de ALB, ECS ou Auto Scaling."}, {"name": "Amazon S3", "abbr": "S3", "cat": "Armazenamento", "icon": "🪣", "certs": ["CLF", "SAA"], "desc": "Object storage com durabilidade de 99.999999999% (11 noves). Armazena objetos de até 5TB. Base de data lakes, backup e hosting estático.", "ex": "Hospedar um site estático React com S3 + CloudFront por menos de $1/mês, com latência global de <50ms via edge locations."}, {"name": "Amazon S3 Glacier", "abbr": "Glacier", "cat": "Armazenamento", "icon": "🧊", "certs": ["CLF", "SAA"], "desc": "Armazenamento de arquivamento de longo prazo com custo muito baixo (~$0.004/GB/mês). Três modalidades: Instant, Flexible e Deep Archive.", "ex": "Arquivar logs de compliance por 7 anos em Glacier Deep Archive por $0.00099/GB/mês, com retrieval em até 12 horas quando necessário."}, {"name": "Amazon EBS", "abbr": "EBS", "cat": "Armazenamento", "icon": "💾", "certs": ["CLF", "SAA"], "desc": "Block storage persistente para instâncias EC2. Tipos: gp3 (geral), io2 (IOPS provisionado), st1 (throughput), sc1 (cold). Persiste após stop da instância.", "ex": "Banco de dados PostgreSQL rodando em EC2 usa volume io2 Block Express com 64.000 IOPS provisionados para garantir performance consistente."}, {"name": "Amazon EFS", "abbr": "EFS", "cat": "Armazenamento", "icon": "🗂️", "certs": ["CLF", "SAA"], "desc": "File system NFS gerenciado e elástico. Pode ser montado em múltiplas instâncias EC2 simultaneamente em múltiplas AZs. Escala automaticamente.", "ex": "Cluster de servidores web compartilhando assets de usuário (uploads) via EFS — todos os nodes leem/escrevem no mesmo filesystem."}, {"name": "Amazon FSx for Windows", "abbr": "FSx Win", "cat": "Armazenamento", "icon": "🪟", "certs": ["SAA"], "desc": "File system Windows Server gerenciado (SMB/NTFS). Compatível com Active Directory, DFS, NTFS e ACLs Windows.", "ex": "Migrar file server Windows on-premises para FSx sem alterar aplicações — usuários continuam acessando via UNC path `\\\\fs.exemplo.com\\share`."}, {"name": "Amazon FSx for Lustre", "abbr": "FSx Lustre", "cat": "Armazenamento", "icon": "⚡", "certs": ["SAA"], "desc": "File system de alta performance para HPC e ML. Throughput de centenas de GB/s, latência de submilissegundo. Integra nativamente com S3.", "ex": "Job de treinamento de ML em cluster de GPUs acessa dataset de 10TB no S3 via FSx Lustre com throughput de 400 GB/s."}, {"name": "AWS Storage Gateway", "abbr": "Storage GW", "cat": "Armazenamento", "icon": "🔗", "certs": ["CLF", "SAA"], "desc": "Bridge entre infraestrutura on-premises e armazenamento AWS. Três modos: File Gateway (S3), Volume Gateway (EBS), Tape Gateway (Glacier).", "ex": "Sistema legado on-premises continua escrevendo em NFS, mas Storage Gateway File Gateway replica tudo para S3 em background."}, {"name": "AWS Snow Family", "abbr": "Snow", "cat": "Armazenamento", "icon": "❄️", "certs": ["CLF", "SAA"], "desc": "Dispositivos físicos para migrar petabytes de dados quando a rede é muito lenta. Snowcone (8TB), Snowball Edge (80TB), Snowmobile (100PB).", "ex": "Empresa com 500TB de dados e link de 1Gbps usaria Snowball Edge — transferência leva 40 dias pela rede, mas 1 semana com o dispositivo."}, {"name": "AWS DataSync", "abbr": "DataSync", "cat": "Armazenamento", "icon": "🔄", "certs": ["SAA"], "desc": "Transferência online acelerada de dados entre on-premises e AWS (S3, EFS, FSx). Até 10x mais rápido que ferramentas open-source.", "ex": "Migrar 100TB de um NAS on-premises para S3 usando DataSync, com verificação de integridade automática em cada arquivo transferido."}, {"name": "AWS Backup", "abbr": "Backup", "cat": "Armazenamento", "icon": "💿", "certs": ["CLF", "SAA"], "desc": "Serviço centralizado de backup para EC2, EBS, RDS, DynamoDB, EFS, FSx e Storage Gateway. Define políticas de retenção e recovery points.", "ex": "Policy de backup que cria snapshot diário de todos os volumes RDS e EC2, retém por 35 dias e copia para outra região automaticamente."}, {"name": "AWS Transfer Family", "abbr": "Transfer", "cat": "Armazenamento", "icon": "📡", "certs": ["SAA"], "desc": "Servidor SFTP, FTPS e FTP gerenciado que transfere arquivos diretamente para/do S3 ou EFS. Sem alterar clientes existentes.", "ex": "Parceiros B2B enviam arquivos EDI via SFTP para o mesmo endpoint de sempre — por baixo, os arquivos chegam direto no S3."}, {"name": "Amazon RDS", "abbr": "RDS", "cat": "Banco de Dados", "icon": "🗃️", "certs": ["CLF", "SAA"], "desc": "Bancos de dados relacionais gerenciados: MySQL, PostgreSQL, MariaDB, Oracle, SQL Server. Gerencia backups, patches, Multi-AZ e Read Replicas.", "ex": "Aplicação e-commerce com RDS PostgreSQL Multi-AZ — failover automático em <60 segundos se a primary AZ falhar."}, {"name": "Amazon Aurora", "abbr": "Aurora", "cat": "Banco de Dados", "icon": "✨", "certs": ["CLF", "SAA"], "desc": "Banco de dados relacional AWS-native compatível com MySQL e PostgreSQL. Storage distribuído que cresce automaticamente até 128TB, failover em 30s.", "ex": "Aurora MySQL com 5 Read Replicas distribui carga de leitura entre AZs — 5x throughput do MySQL padrão, mesmo preço de RDS."}, {"name": "Amazon DynamoDB", "abbr": "DDB", "cat": "Banco de Dados", "icon": "⚡", "certs": ["CLF", "SAA"], "desc": "Banco NoSQL serverless com latência de milissegundos em qualquer escala. Paga por throughput (RCU/WCU) ou on-demand. Suporta até 20 milhões de RPS.", "ex": "Jogo mobile com 50 milhões de jogadores usa DynamoDB para armazenar sessões — latência <10ms garantida independente do volume."}, {"name": "Amazon ElastiCache", "abbr": "ElastiCache", "cat": "Banco de Dados", "icon": "🚄", "certs": ["CLF", "SAA"], "desc": "Cache in-memory gerenciado. Redis (estruturas de dados, Pub/Sub, HA com clustering) ou Memcached (simples, multi-thread). Latência de microssegundos.", "ex": "API que faz SELECT em RDS a cada request passa a usar ElastiCache Redis — resposta cai de 200ms para 1ms para dados frequentemente acessados."}, {"name": "Amazon Redshift", "abbr": "Redshift", "cat": "Banco de Dados", "icon": "📊", "certs": ["CLF", "SAA"], "desc": "Data warehouse colunar de petabytes (OLAP). MPP (massively parallel processing) para queries analíticas em bilhões de registros. Integra com S3 via Spectrum.", "ex": "Análise de 5 anos de transações (2 bilhões de registros) em 8 segundos via query SQL no Redshift — impossível em RDS tradicional."}, {"name": "Amazon DocumentDB", "abbr": "DocumentDB", "cat": "Banco de Dados", "icon": "📄", "certs": ["SAA"], "desc": "Banco de dados de documentos (JSON) compatível com MongoDB. Gerenciado, com Multi-AZ e replicação de até 15 read replicas.", "ex": "Migrar aplicação que usa MongoDB para DocumentDB sem reescrever código — mesma API, mas gerenciado e com backup automático."}, {"name": "Amazon Neptune", "abbr": "Neptune", "cat": "Banco de Dados", "icon": "🕸️", "certs": ["SAA"], "desc": "Banco de dados de grafos gerenciado. Suporta Gremlin, SPARQL e openCypher para modelar e consultar relacionamentos complexos.", "ex": "Rede social modela amizades e conexões em Neptune — query 'amigos de amigos de amigos' executada em <100ms em um grafo de 100M nodes."}, {"name": "Amazon DAX", "abbr": "DAX", "cat": "Banco de Dados", "icon": "⚡", "certs": ["SAA"], "desc": "Cache in-memory específico para DynamoDB. Drop-in compatible (mesma API), reduz latência de milissegundos para microssegundos. Ideal para hot keys.", "ex": "Item de produto mais popular (hot key no DynamoDB) servido via DAX com latência de 9µs em vez de 9ms — 1000x mais rápido."}, {"name": "Amazon RDS Proxy", "abbr": "RDS Proxy", "cat": "Banco de Dados", "icon": "🔌", "certs": ["SAA"], "desc": "Connection pooler gerenciado para RDS e Aurora. Reduz abertura de conexões — crítico quando Lambda com alta concorrência tenta conectar ao banco.", "ex": "Sem RDS Proxy: 1000 Lambdas concorrentes abrem 1000 conexões ao RDS e o banco trava. Com Proxy: pool de 20 conexões atende todos."}, {"name": "Amazon Keyspaces", "abbr": "Keyspaces", "cat": "Banco de Dados", "icon": "🔑", "certs": ["SAA"], "desc": "Apache Cassandra serverless gerenciado. Compatível com drivers e CQL do Cassandra, sem gerenciar clusters, replicação ou sharding.", "ex": "Migrar cluster Cassandra on-premises para Keyspaces — mesma aplicação, sem alterar CQL queries, mas sem ops de cluster."}, {"name": "Amazon Timestream", "abbr": "Timestream", "cat": "Banco de Dados", "icon": "⏱️", "certs": ["SAA"], "desc": "Banco de dados de time series serverless para IoT e telemetria. Armazena trilhões de eventos/dia com queries SQL otimizadas para séries temporais.", "ex": "Sensores IoT de uma fábrica enviam 10 milhões de readings/segundo para Timestream — query 'média de temperatura por hora' em <1 segundo."}, {"name": "Amazon MemoryDB for Redis", "abbr": "MemoryDB", "cat": "Banco de Dados", "icon": "🧠", "certs": ["SAA"], "desc": "Redis compatível com durabilidade (persistência em Multi-AZ com WAL). Combina velocidade de cache com durabilidade de banco de dados primário.", "ex": "Aplicação de trading usa MemoryDB como banco primário — latência de microssegundos + durabilidade garantida mesmo em caso de falha."}, {"name": "Amazon VPC", "abbr": "VPC", "cat": "Rede", "icon": "🌐", "certs": ["CLF", "SAA"], "desc": "Rede virtual isolada dentro da AWS. Define subnets públicas/privadas, route tables, Internet Gateway, NAT Gateway e NACLs.", "ex": "Aplicação 3-tier: subnets públicas para ALB, subnets privadas para EC2 e subnets isoladas para RDS — comunicação controlada por security groups."}, {"name": "Amazon CloudFront", "abbr": "CloudFront", "cat": "Rede", "icon": "🌍", "certs": ["CLF", "SAA"], "desc": "CDN global com 400+ edge locations. Serve conteúdo estático e dinâmico com baixa latência. Integra com S3, ALB, EC2 e API Gateway como origens.", "ex": "Site com usuários no Brasil e Japão — CloudFront serve assets estáticos do edge mais próximo com latência <20ms, on": "↔️", "certs": ["SAA"], "desc": "Conexão direta entre duas VPCs (mesma conta, contas diferentes ou regiões diferentes) via rede privada AWS. Não é transitivo.", "ex": "VPC de produção precisa acessar VPC de dados compartilhados — VPC Peering cria rota privada sem passar pela internet."}, {"name": "AWS PrivateLink", "abbr": "PrivateLink", "cat": "Rede", "icon": "🔐", "certs": ["SAA"], "desc": "Expõe serviços para outras VPCs via endpoint de interface (ENI), sem expor à internet. Mais seguro que peering para acesso a serviços específicos.", "ex": "SaaS provider expõe API via PrivateLink — cliente acessa via endpoint privado sem abrir regras de firewall para internet."}, {"name": "AWS Global Accelerator", "abbr": "GAccel", "cat": "Rede", "icon": "🏎️", "certs": ["SAA"], "desc": "Rede anycast que roteia tráfego pelo backbone da AWS desde o usuário até o endpoint (não pela internet pública). Reduz latência e melhora disponibilidade.", "ex": "Aplicação global usa Global Accelerator — usuário no Brasil tem tráfego entrado na rede AWS em São Paulo e seguindo pelo backbone até Oregon (50% mais rápido)."}, {"name": "NAT Gateway", "abbr": "NAT GW", "cat": "Rede", "icon": "🔁", "certs": ["SAA"], "desc": "Permite que instâncias em subnets privadas acessem a internet (para updates, APIs) sem serem acessíveis de fora. Gerenciado, escalável, HA por AZ.", "ex": "EC2 em subnet privada precisa baixar pacotes npm — NAT Gateway traduz o IP privado para IP público da saída sem expor a instância."}, {"name": "AWS Network Firewall", "abbr": "Net FW", "cat": "Rede", "icon": "🧱", "certs": ["SAA"], "desc": "Firewall de rede stateful gerenciado para filtragem de tráfego em nível de VPC. Suporta regras Suricata, IDS/IPS e filtragem de domínio.", "ex": "Bloquear todo tráfego de saída para dominíos maliciosos conhecidos e inspecionar payloads de entrada com regras de IDS no Network Firewall."}, {"name": "AWS IAM", "abbr": "IAM", "cat": "Segurança", "icon": "🔑", "certs": ["CLF", "SAA"], "desc": "Controla quem (identidade) pode fazer o quê (ação) em qual recurso (recurso). Usuários, grupos, roles e policies (inline vs managed).", "ex": "Lambda assume IAM Role com policy que permite apenas `s3:GetObject` em um bucket específico — princípio de least privilege."}, {"name": "Amazon Cognito", "abbr": "Cognito", "cat": "Segurança", "icon": "👤", "certs": ["CLF", "SAA"], "desc": "User Pools (autenticação de usuários finais com MFA, OAuth) e Identity Pools (troca de tokens por credenciais AWS temporárias para acessar recursos).", "ex": "App mobile usa Cognito User Pools para login com Google — após auth, Cognito Identity Pool dá credenciais temporárias para upload no S3."}, {"name": "AWS KMS", "abbr": "KMS", "cat": "Segurança", "icon": "🗝️", "certs": ["CLF", "SAA"], "desc": "Gerencia chaves de criptografia. Customer Master Keys (CMKs) usam envelope encryption: KMS cifra a data key, que cifra os dados. Integra com S3, RDS, EBS.", "ex": "S3 com SSE-KMS: cada objeto é cifrado com uma data key diferente, e a data key é cifrada pela CMK no KMS — auditoria via CloudTrail."}, {"name": "AWS Secrets Manager", "abbr": "Secrets", "cat": "Segurança", "icon": "🤐", "certs": ["CLF", "SAA"], "desc": "Armazena e rotaciona automaticamente segredos (senhas de banco, API keys, credenciais). Integra com RDS para rotação automática.", "ex": "Lambda busca senha do banco no Secrets Manager em runtime — nunca hardcoded no código ou em variáveis de ambiente em plaintext."}, {"name": "AWS ACM", "abbr": "ACM", "cat": "Segurança", "icon": "📜", "certs": ["CLF", "SAA"], "desc": "Provisiona e renova certificados SSL/TLS gratuitamente para uso em CloudFront, ALB e API Gateway. Renovação automática antes do vencimento.", "ex": "ALB com certificado SSL do ACM — HTTPS sem custo de certificado e sem alertas de vencimento, renovação é automática."}, {"name": "AWS WAF", "abbr": "WAF", "cat": "Segurança", "icon": "🛡️", "certs": ["CLF", "SAA"], "desc": "Web Application Firewall que filtra requisições HTTP/S com WebACLs. Regras managed (OWASP Top 10, bots) ou customizadas. Rate limiting incluso.", "ex": "Proteger API pública contra SQLi e XSS com WAF Managed Rules, e limitar a 1000 req/5min por IP para prevenir DDoS Layer 7."}, {"name": "AWS Shield", "abbr": "Shield", "cat": "Segurança", "icon": "🏛️", "certs": ["CLF", "SAA"], "desc": "Standard: proteção DDoS Layer 3/4 gratuita e automática para todos. Advanced ($3000/mês): proteção Layer 7, DRT 24/7 e crédito de custo de escaling.", "ex": "CloudFront + Shield Standard protege automaticamente contra volumetric attacks (UDP floods, SYN floods) sem configuração adicional."}, {"name": "Amazon GuardDuty", "abbr": "GuardDuty", "cat": "Segurança", "icon": "🕵️", "certs": ["CLF", "SAA"], "desc": "Threat detection contínua via ML. Analisa CloudTrail, VPC Flow Logs e DNS logs para detectar comportamentos suspeitos (ex: mining de crypto, acesso incomum).", "ex": "GuardDuty detecta instância EC2 fazendo chamadas DNS para domínios de C&C (command-and-control) — alerta de possível malware em minutos."}, {"name": "Amazon Inspector", "abbr": "Inspector", "cat": "Segurança", "icon": "🔍", "certs": ["CLF", "SAA"], "desc": "Avaliação automática de vulnerabilidades em instâncias EC2, containers (ECR) e Lambda. Gera findings com severidade e remediação sugerida.", "ex": "Inspector escaneia continuamente ECR e detecta CVE crítica em imagem de container antes do deploy chegar a produção."}, {"name": "Amazon Macie", "abbr": "Macie", "cat": "Segurança", "icon": "🔎", "certs": ["CLF", "SAA"], "desc": "Usa ML para descobrir e proteger dados sensíveis (PII, financeiros, credenciais) no S3. Identifica buckets públicos, não criptografados ou compartilhados.", "ex": "Macie escaneia 500 buckets S3 e encontra 3 com CPFs e números de cartão em CSVs que deveriam estar criptografados — alerta de conformidade LGPD."}, {"name": "AWS Security Hub", "abbr": "Sec Hub", "cat": "Segurança", "icon": "📋", "certs": ["CLF", "SAA"], "desc": "Painel central de segurança que agrega findings de GuardDuty, Inspector, Macie, Config e parceiros. Score de conformidade CIS e PCI DSS.", "ex": "Security Hub centraliza alertas de segurança de 20 contas AWS em um único painel — equipe de SecOps tem visibilidade cross-account."}, {"name": "AWS CloudHSM", "abbr": "CloudHSM", "cat": "Segurança", "icon": "🔏", "certs": ["SAA"], "desc": "Hardware Security Module dedicado (não compartilhado) em conformidade com FIPS 140-2 Level 3. Você controla as chaves — nem a AWS pode acessá-las.", "ex": "Banco com regulação que exige chaves criptográficas em HSM dedicado usa CloudHSM — conformidade FIPS sem hardware físico."}, {"name": "Amazon Detective", "abbr": "Detective", "cat": "Segurança", "icon": "🧩", "certs": ["SAA"], "desc": "Analisa e visualiza comportamentos suspeitos para investigação de incidentes de segurança. Correlaciona dados de GuardDuty, CloudTrail e VPC Flow Logs.", "ex": "Após GuardDuty disparar alerta, Detective mostra linha do tempo completa: quais IPs, usuários e recursos foram envolvidos no incidente."}, {"name": "AWS Organizations", "abbr": "Orgs", "cat": "Segurança", "icon": "🏢", "certs": ["CLF", "SAA"], "desc": "Gerencia múltiplas contas AWS em uma hierarquia. SCPs (Service Control Policies) definem guardrails — o que contas filhas NUNCA podem fazer.", "ex": "SCP que impede qualquer conta filha de desabilitar CloudTrail ou criar recursos fora das regiões permitidas — controle centralizado de compliance."}, {"name": "AWS Control Tower", "abbr": "Control Tower", "cat": "Segurança", "icon": "🗼", "certs": ["CLF", "SAA"], "desc": "Configura e governa um ambiente multi-conta seguindo best practices AWS automaticamente. Landing Zone com guardrails preventivos e detectivos.", "ex": "Empresa em crescimento usa Control Tower para provisionar novas contas AWS já com logging, SCPs e config de segurança corretos."}, {"name": "AWS IAM Identity Center", "abbr": "SSO", "cat": "Segurança", "icon": "🎫", "certs": ["CLF", "SAA"], "desc": "SSO para acessar múltiplas contas AWS e aplicações SaaS com um único login. Integra com Active Directory, Okta, Azure AD.", "ex": "Desenvolvedor faz login único via Okta e acessa 15 contas AWS com o papel correto em cada uma — sem múltiplas credenciais IAM."}, {"name": "AWS STS", "abbr": "STS", "cat": "Segurança", "icon": "🎟️", "certs": ["SAA"], "desc": "Gera credenciais temporárias para usuários e aplicações assumirem IAM Roles. Base de federação e cross-account access.", "ex": "Aplicação mobile usa Cognito que chama STS AssumeRoleWithWebIdentity — retorna credenciais temporárias (15min) para acessar S3."}, {"name": "AWS Config", "abbr": "Config", "cat": "Segurança", "icon": "📐", "certs": ["CLF", "SAA"], "desc": "Avalia e audita configurações de recursos AWS contra rules (ex: S3 sem criptografia = NON_COMPLIANT). Rastreia histórico de mudanças de configuração.", "ex": "Config rule que alerta quando qualquer security group permite tráfego SSH da internet (0.0.0.0/0) — detecção automática de misconfiguration."}, {"name": "Amazon CloudWatch", "abbr": "CW", "cat": "Monitoramento", "icon": "📡", "certs": ["CLF", "SAA"], "desc": "Coleta métricas, logs e eventos de todos os serviços AWS. Alarmes disparam ações (Auto Scaling, SNS, Lambda). Dashboards customizáveis.", "ex": "Alarme CloudWatch monitora CPUUtilization do EC2 — se >70% por 2 minutos, trigger de scale-out no ASG e notificação via SNS."}, {"name": "AWS CloudTrail", "abbr": "CloudTrail", "cat": "Monitoramento", "icon": "🗺️", "certs": ["CLF", "SAA"], "desc": "Registra todas as chamadas de API AWS (quem fez o quê, quando e de onde). Retém por 90 dias free ou indefinidamente em S3. Essencial para auditoria.", "ex": "Investigação de segurança: CloudTrail mostra que às 02h17 o usuário `dev-temp` deletou 50 buckets S3 de certa conta — evidência forense."}, {"name": "AWS Systems Manager", "abbr": "SSM", "cat": "Monitoramento", "icon": "⚙️", "certs": ["CLF", "SAA"], "desc": "Suite de ferramentas de gerenciamento: Session Manager (SSH var curCat = null, curCert = null, curSearch = '';

function render(){
  const q = curSearch.toLowerCase();
  const filtered = SVCS.filter(function(s){
    if(curCat && s.cat !== curCat) return false;
    if(curCert && !s.certs.includes(curCert)) return false;
    if(q && !s.name.toLowerCase().includes(q) && !s.desc.toLowerCase().includes(q) && !s.abbr.toLowerCase().includes(q)) return false;
    return true;
  });
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  if(filtered.length === 0){ grid.innerHTML=''; empty.style.display='block'; }
  else{ empty.style.display='none'; }
  grid.innerHTML = filtered.map(function(s,i){
    const certs = s.certs.map(function(c){ return '<span class="badge '+c.toLowerCase()+'">'+c+'</span>'; }).join('');
    return '<div class="svc-card">'+
      '<div class="svc-head">'+
        '<div class="svc-icon">'+s.icon+'</div>'+
        '<div class="svc-info">'+
          '<h3>'+s.name+'</h3>'+
          '<div class="abbr">'+s.abbr+'</div>'+
          '<div class="svc-badges"><span class="badge cat">'+s.cat+'</span>'+certs+'</div>'+
        '</div>'+
      '</div>'+
      '<div class="svc-desc">'+s.desc+'</div>'+
      '<div class="ex-toggle" onclick="toggleEx(this)"><span class="arr">▶</span> Ver exemplo</div>'+
      '<div class="svc-ex">'+s.ex+'</div>'+
    '</div>';
  }).join('');
  document.getElementById('count').textContent = filtered.length + ' de ' + SVCS.length + ' serviços';
}

function toggleEx(toggle){
  toggle.classList.toggle('open');
  const ex = toggle.nextElementSibling;
  ex.style.display = ex.style.display === 'block' ? 'none' : 'block';
}

function filterCat(cat, btn){
  curCat = cat;
  document.querySelectorAll('.ni').forEach(function(n){ n.classList.remove('active'); });
  btn.classList.add('active');
  if(window.innerWidth<=768){
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('open');
  }
  render();
}

function filterCert(cert, btn){
  curCert = cert;
  document.querySelectorAll('.cf-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  render();
}

function doFilter(){
  curSearch = document.getElementById('searchbox').value;
  render();
}

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
}
document.getElementById('overlay').addEventListener('click',function(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
});

render();
</script>
</body>
</html>
